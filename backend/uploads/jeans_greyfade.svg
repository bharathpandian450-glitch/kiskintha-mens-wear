  <rect x="20" y="250" width="260" height="32" rx="8" fill="#0f172a" opacity="0.85"/>
  <text x="150" y="271" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle">CHARCOAL GREY FADE</text>
