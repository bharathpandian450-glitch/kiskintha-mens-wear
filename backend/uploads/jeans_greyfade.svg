    <rect x="30" y="20" width="140" height="25" rx="4" fill="#475569" stroke="#1e293b" stroke-width="3"/>
    <!-- Belt Loops -->
    <rect x="45" y="17" width="6" height="31" fill="#1e293b"/>
    <rect x="97" y="17" width="6" height="31" fill="#1e293b"/>
